name: fieldnotes_server
description: FieldNote backend for campaigns, payments and volunteer evidence.

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  googleapis_auth: ^2.0.0
  crypto: ^3.0.6
  http: ^1.6.0
  mailer: ^7.2.0
  serverpod: 4.0.0
  serverpod_auth_idp_server: 4.0.0
  serverpod_cloud_storage: 4.0.0
  timezone: ^0.11.1

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.0
  test: ^1.25.5

serverpod:
  scripts:
    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    # On failure, clean and retry once to clear stale Flutter build caches.
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\fieldnotes_flutter
        & set ARGS=web --base-href /
        && (call flutter build %ARGS% || (flutter clean && call flutter build %ARGS%))
        && xcopy /E /I /Y build\web ..\fieldnotes_server\web\app
      posix: |
        rm -rf ../fieldnotes_server/web/app
        cd ../fieldnotes_flutter
        set -- web --base-href / --output ../fieldnotes_server/web/app
        flutter build "$@" || { flutter clean && flutter build "$@"; }

  # Flutter app launched by serverpod start.
  flutter_apps:
    fieldnotes:
      path: ../fieldnotes_flutter
      displayName: "Fieldnotes app"
      auto_launch: true
      target: lib/driver.dart
      device: web-server
      web-port: 9998
