class: OrganizationMember
table: fieldnote_organization_member
fields:
  organizationId: int, relation(parent=fieldnote_organization)
  authUserId: UuidValue
  displayName: String
  role: MemberRole
  createdAt: DateTime, default=now
indexes:
  fieldnote_member_user_org_idx:
    fields: organizationId, authUserId
    unique: true

