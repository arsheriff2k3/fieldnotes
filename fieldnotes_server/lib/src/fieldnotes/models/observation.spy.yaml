class: Observation
table: fieldnote_observation
fields:
  clientId: String, unique
  campaignId: int, relation(parent=fieldnote_campaign)
  assetId: int?, relation(parent=fieldnote_asset)
  observerAuthUserId: UuidValue
  capturedAt: DateTime
  latitude: double
  longitude: double
  accuracyMeters: double
  originalNote: String
  species: String?
  condition: ObservationCondition
  issues: String
  recommendedFollowUp: String
  aiConfidence: AiConfidence
  aiRationale: String
  reviewState: ReviewState
  possibleDuplicateAssetId: int?, relation(parent=fieldnote_asset)
  createdAt: DateTime, default=now
indexes:
  fieldnote_observation_campaign_idx:
    fields: campaignId
  fieldnote_observation_review_idx:
    fields: campaignId, reviewState
  fieldnote_observation_asset_idx:
    fields: assetId
