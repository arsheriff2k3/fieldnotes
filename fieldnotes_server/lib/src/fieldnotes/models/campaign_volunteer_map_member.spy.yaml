### A volunteer visible to the creator of a published campaign. Map
### coordinates are rounded to a coarse area, never the person's GPS point.
class: CampaignVolunteerMapMember
fields:
  profileId: int
  displayName: String
  areaLabel: String
  latitude: double?
  longitude: double?
  status: String
  # A-2: set for an anonymous area bucket of at least three volunteers who
  # have not joined. Buckets have profileId 0 and an empty displayName.
  volunteerCount: int?
