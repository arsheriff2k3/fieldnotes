class: FieldnoteUserProfile
table: fieldnote_user_profile
fields:
  authUserId: UuidValue, unique
  role: AccountRole
  displayName: String
  sponsorType: String?
  organizationName: String?
  contactPhone: String?
  city: String
  locationAddress: String?
  locationPlaceId: String?
  locationLatitude: double?
  locationLongitude: double?
  interests: String
  skills: String
  # A-9: transactional email preference. The account-deletion notice is
  # always sent.
  emailNotifications: bool, default=true
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
