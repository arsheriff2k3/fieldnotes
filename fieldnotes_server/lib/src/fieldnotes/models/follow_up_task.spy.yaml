class: FollowUpTask
table: fieldnote_follow_up_task
fields:
  campaignId: int, relation(parent=fieldnote_campaign)
  observationId: int?, relation(parent=fieldnote_observation)
  assetId: int?, relation(parent=fieldnote_asset)
  title: String
  description: String
  assigneeAuthUserId: UuidValue?
  dueAt: DateTime?
  status: TaskStatus
  createdBy: UuidValue
  completionNote: String?
  completedAt: DateTime?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  fieldnote_task_campaign_status_idx:
    fields: campaignId, status
