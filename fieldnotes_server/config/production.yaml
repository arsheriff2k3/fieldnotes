# This is the configuration file for your production environment.
#
# Nothing here is a real host. Every value marked REQUIRED must be supplied
# at deploy time through the SERVERPOD_* environment variable shown next to
# it; Serverpod merges those over this file (see docs/DEPLOYMENT.md). The
# localhost defaults only keep the YAML valid and fail safe if an override
# is forgotten.

# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: localhost # REQUIRED: SERVERPOD_API_SERVER_PUBLIC_HOST=<api-host>
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server. Keep it on a private network.
insightsServer:
  port: 8081
  publicHost: localhost # SERVERPOD_INSIGHTS_SERVER_PUBLIC_HOST
  publicPort: 443
  publicScheme: https

# Configuration for the web server (Flutter web app, /c/<slug> share pages,
# /legal/*, /.well-known/*, /webhooks/razorpay).
webServer:
  port: 8082
  publicHost: localhost # REQUIRED: SERVERPOD_WEB_SERVER_PUBLIC_HOST=<web-host>
  publicPort: 443
  publicScheme: https

# Managed PostgreSQL. Password: SERVERPOD_DATABASE_PASSWORD.
database:
  host: localhost # REQUIRED: SERVERPOD_DATABASE_HOST
  port: 5432 # SERVERPOD_DATABASE_PORT
  name: fieldnote # SERVERPOD_DATABASE_NAME
  user: postgres # SERVERPOD_DATABASE_USER
  requireSsl: true # SERVERPOD_DATABASE_REQUIRE_SSL
  #isUnixSocket: true # defaults to false
  #maxConnectionCount: 10 # Defaults to 10, a negative or null value removes the limit

# Redis carries session.messages (live campaign streams, auth revocation)
# across instances (A-8). Password: SERVERPOD_REDIS_PASSWORD.
redis:
  enabled: true # SERVERPOD_REDIS_ENABLED
  host: localhost # REQUIRED: SERVERPOD_REDIS_HOST
  port: 6379 # SERVERPOD_REDIS_PORT
  #user: # SERVERPOD_REDIS_USER, defaults to empty
  requireSsl: true # SERVERPOD_REDIS_REQUIRE_SSL

maxRequestSize: 25165824 # Evidence photos and 90-second dictation recordings.

sessionLogs:
  consoleEnabled: false
# persistentEnabled: true
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

# futureCallExecutionEnabled: true # Defaults to true

#futureCall:
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000

# R-6: browser origins allowed to open WebSockets and make credentialed
# (cookie) requests. Native apps send no Origin header and are unaffected.
# REQUIRED: SERVERPOD_ALLOWED_ORIGINS=https://<web-host> (comma-separated).
allowedOrigins:
  - https://localhost

# httpOnly auth cookies for the web app (it opts in with
# `client.cookieAuth = true`; until then it keeps bearer tokens). Overrides:
# SERVERPOD_AUTH_COOKIE_DOMAIN, _SECURE, _SAME_SITE, _NAME, _PATH.
authCookie:
  sameSite: lax # api and web hosts must share a registrable domain
  secure: true
  #domain: <parent-domain> # set to share across api/web subdomains
