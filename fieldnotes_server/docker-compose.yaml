services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fieldnotes
      POSTGRES_PASSWORD: "REDACTED_CONFIGURE_LOCALLY"
    volumes:
      - fieldnotes_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: ["redis-server", "--requirepass", "${SERVERPOD_PASSWORD_redis:?Set SERVERPOD_PASSWORD_redis in the local .env}"]
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fieldnotes_test
      POSTGRES_PASSWORD: "REDACTED_CONFIGURE_LOCALLY"
    volumes:
      - fieldnotes_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: ["redis-server", "--requirepass", "${SERVERPOD_PASSWORD_redis_test:-test-only-not-a-secret}"]
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  fieldnotes_data:
  fieldnotes_test_data:
