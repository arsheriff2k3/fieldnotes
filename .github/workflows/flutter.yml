name: Flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Analyze and test the Flutter app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      # .env.maps is a declared pubspec asset but holds local, git-ignored
      # client keys. CI uses the committed example (empty keys), so every map
      # renders its coordinate fallback.
      - name: Provide placeholder Maps key file
        working-directory: fieldnotes_flutter
        run: |
          if [ -f .env.maps.example ]; then
            cp .env.maps.example .env.maps
          else
            : > .env.maps
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        working-directory: fieldnotes_flutter
        run: flutter analyze

      - name: Test
        working-directory: fieldnotes_flutter
        run: flutter test
