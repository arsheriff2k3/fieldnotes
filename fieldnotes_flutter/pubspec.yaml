name: fieldnotes_flutter
description: FieldNote Teams AI - sponsors fund nearby, evidence-backed volunteer action.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

dependencies:
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  cupertino_icons: ^1.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.1.0
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.0
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  intl: ^0.20.2
  pdf: 3.11.3
  share_plus: 13.3.0
  app_links: ^7.2.1
  razorpay_flutter: ^1.4.7
  record: ^7.1.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.3.0
  web: ^1.1.1
  fieldnotes_client:
    path: ../fieldnotes_client
  serverpod_flutter: 4.0.0
  serverpod_auth_idp_flutter: 4.0.0
  flutter_timezone: ^5.1.0
  uuid: ^4.6.0

dev_dependencies:
  # Used for agents to drive the app through the Dart MCP
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  google_maps_flutter_platform_interface: any
dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter:
  uses-material-design: true
  # Generates localization classes from lib/l10n/*.arb.
  generate: true
  assets:
    - assets/config.json
    - .env.maps
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/NotoSansTamil.ttf
    - assets/fonts/NotoSansDevanagari.ttf

# Launcher icons from assets/branding (source: icon.svg, rendered by
# `flutter test tool/render_icon_test.dart`). Regenerate with
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#1D4B3B"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#1D4B3B"
    theme_color: "#1D4B3B"
  macos:
    generate: true
    image_path: assets/branding/icon_macos.png
